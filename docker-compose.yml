services:
  postgres:
    image: postgres:16
    container_name: genaulingua_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Только на петлю: боту база доступна по docker-сети как `postgres`, а
    # "5432:5432" публиковал её на 0.0.0.0 — с паролем из .env в интернет.
    ports:
      - "127.0.0.1:5432:5432"
    # Политика перезапуска жила в docker-compose.prod.yml, ушедшем в архив
    # (28c9a1f). Без неё бот после перезагрузки сервера или падения лежит,
    # пока не поднимут руками.
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Занятия (состояние FSM) — патч 2.1: выкатка бота не обрывает уроки.
  # Без портов наружу: боту он доступен по docker-сети как `redis`.
  # appendonly — переживает и перезапуск самого Redis. Боту нужен
  # REDIS_URL=redis://redis:6379/0 в .env, иначе занятия в памяти, как прежде
  redis:
    image: redis:7-alpine
    container_name: genaulingua_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: genaulingua_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    # exec — чтобы сигнал остановки получил Python, а не sh: без него
    # docker stop через 10 с убивал бота по SIGKILL посреди ответов (аудит 2.1)
    command: >
      sh -c "alembic upgrade head &&
             exec python app/main.py"
    # Бот дожидается начатых ответов до 25 с (распознавание голоса — до 21 с)
    stop_grace_period: 40s
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
