[pytest]
testpaths = tests
asyncio_mode = auto
# Цикл фикстур должен совпадать с циклом теста, иначе финализаторы async-фикстур
# не доезжают и соединения к БД утекают в состоянии idle in transaction,
# после чего TRUNCATE следующего теста встаёт на блокировке.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:app.*
